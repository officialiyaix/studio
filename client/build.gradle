// Root project: declares both Loom plugin flavours; each version subproject applies the right one.
//  * net.fabricmc.fabric-loom        — Minecraft 26.x (unobfuscated, no remapping)
//  * net.fabricmc.fabric-loom-remap  — Minecraft 1.20.1–1.21.11 (official Mojang mappings)
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
	apply from: rootProject.file('gradle/stabled-version.gradle')
}
