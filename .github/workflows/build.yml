name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: List Minecraft versions
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # One Stabled Client build per client/versions/<minecraft>/gradle.properties
        run: echo "list=$(ls client/versions | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  client:
    name: Stabled Client for Minecraft ${{ matrix.minecraft }}
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.versions.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle runs on 25; each version compiles for its own Java release (17, 21 or 25).
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: client
        run: ./gradlew -Pstabled.versions=${{ matrix.minecraft }} :mc-${{ matrix.minecraft }}:build --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: stabled-client-${{ matrix.minecraft }}
          path: client/versions/${{ matrix.minecraft }}/build/libs/stabled-client-*+mc${{ matrix.minecraft }}.jar
          if-no-files-found: error

  launcher-checks:
    name: Launcher checks
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stabled-client-*
          path: client-jars
          merge-multiple: true
      - name: Bundle client jars
        # stabled-client-1.0.0+mc<minecraft>.jar -> resources/clients/stabled-client-<minecraft>.jar
        run: |
          mkdir -p launcher/src-tauri/resources/clients
          for f in client-jars/stabled-client-*+mc*.jar; do
            v="${f##*+mc}"; v="${v%.jar}"
            cp "$f" "launcher/src-tauri/resources/clients/stabled-client-$v.jar"
          done
          ls launcher/src-tauri/resources/clients
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev llvm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Frontend type check and build
        working-directory: launcher
        run: |
          npm ci
          npm run build
      - name: Backend tests
        working-directory: launcher/src-tauri
        run: cargo test --lib
      - name: Type-check Windows-only code
        working-directory: launcher/src-tauri
        run: cargo check --target x86_64-pc-windows-msvc

  windows:
    name: Windows installer
    needs: client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stabled-client-*
          path: client-jars
          merge-multiple: true
      - name: Bundle client jars
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force launcher/src-tauri/resources/clients | Out-Null
          Get-ChildItem client-jars -Filter 'stabled-client-*+mc*.jar' | ForEach-Object {
            $v = $_.BaseName -replace '^.*\+mc', ''
            Copy-Item $_.FullName "launcher/src-tauri/resources/clients/stabled-client-$v.jar"
          }
          Get-ChildItem launcher/src-tauri/resources/clients
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - name: Build installer
        working-directory: launcher
        env:
          # Public identifiers only — set them as repository variables (Settings → Secrets and variables → Actions → Variables).
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          DISCORD_APPLICATION_ID: ${{ vars.DISCORD_APPLICATION_ID }}
          DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}
          NEWS_FEED_URL: ${{ vars.NEWS_FEED_URL }}
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: stabled-windows-installer
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
